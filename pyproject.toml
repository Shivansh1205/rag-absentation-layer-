[project]
name = "abstention-data"
version = "0.1.0"
description = "Synthetic training data pipeline for a RAG abstention classifier (Phase 1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # datasets>=2.19,<3.0 (the original pin) resolved huggingface_hub with
    # no upper bound, letting a pre-1.0 pin drift onto huggingface_hub 1.x
    # -- a real cross-version break, not a Linux/Windows difference.
    # Pinned to datasets 5.x with the huggingface_hub range datasets 5.0.0
    # itself declares as compatible (checked against its PyPI metadata),
    # rather than guessing a window.
    "datasets>=5.0,<6.0",
    "huggingface_hub>=0.25,<2.0",
    "pandas>=2.0",
    "pyarrow>=21.0",
    # Phase 2 (feature extraction): covers both CrossEncoder (entailment.py)
    # and SentenceTransformer (diversity.py) -- one dependency, two modules.
    "sentence-transformers>=3.0",
    # torch is technically only a transitive dependency of
    # sentence-transformers, but it must be listed directly for the
    # tool.uv.sources override below to actually take effect -- uv does
    # not apply a source override to a package it only ever encounters
    # transitively during resolution (confirmed by testing: the override
    # was silently ignored, and torch resolved from plain PyPI with the
    # full CUDA stack, until torch was added here explicitly).
    "torch>=2.0",
    # Phase 2 (entity_coverage.py): spaCy NER. This is only the library --
    # the `en_core_web_sm` pipeline itself is a separate model download,
    # not installable via this pin (spaCy models aren't distributed on
    # PyPI). See README.md "Setup" for the one-time
    # `python -m spacy download en_core_web_sm` step.
    "spacy>=3.7",
    # Phase 2 (scripts/extract_features.py): progress bar over the
    # train/eval extraction loop. Almost certainly already resolved
    # transitively (datasets, huggingface_hub, and sentence-transformers
    # all depend on it), but listed directly per this project's own
    # precedent of not relying on undeclared transitive dependencies
    # (see the torch comment above).
    "tqdm>=4.65",
    # Phase 3 (src/abstention_model/): classifier training, calibration,
    # evaluation. Originally floored at >=1.3 (the minimum for
    # HistGradientBoostingClassifier's `class_weight` param and
    # CalibratedClassifierCV's `estimator=` kwarg). Pinned to the exact
    # minor version actually resolved and installed in this project's
    # venv (1.9.0, confirmed against both uv.lock's resolution for
    # python 3.12/win32 and .venv/Lib/site-packages's installed
    # scikit_learn-1.9.0.dist-info) rather than left floating -- Phase
    # 3's trained/calibrated models are joblib pickles, and sklearn does
    # not guarantee pickle compatibility across even minor versions, so
    # letting this drift risks a future `uv sync` silently producing
    # models.joblib that can't be unpickled by whatever wrote them.
    "scikit-learn>=1.9.0,<1.10.0",
    # Phase 3: persisting the trained/calibrated model to artifacts/.
    "joblib>=1.3",
    # Phase 3: reliability diagram + abstention tradeoff curve PNGs.
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abstention_data", "src/abstention_features", "src/abstention_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real-model integration tests that download/run HF models (excluded by default in CI; run with `pytest -m slow`)",
]

# Phase 2 pulls in torch as a transitive dependency of sentence-transformers.
# The default PyPI `torch` wheel on Linux/most platforms bundles the full
# CUDA stack as separate `nvidia-*` dependencies (over 2GB combined) even
# though nothing in this project uses a GPU -- both entailment.py and
# diversity.py are explicitly CPU-only. Routing `torch` through PyTorch's
# own CPU-only wheel index avoids that multi-GB download entirely. This
# only affects which `torch` wheel gets resolved; every other dependency
# still resolves from PyPI as normal.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
